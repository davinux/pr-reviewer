<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="PR Reviewer">
    <title>PR Reviewer</title>
    <!-- App tile: a rounded accent square, shared by the favicon and the navbar. -->
    <rect width="32" height="32" rx="7" fill="#0969da"/>
    <!-- Glyph: a pull request (base branch + merge arrow), the thing being reviewed. -->
    <g transform="translate(.9 .9) scale(1.2)" fill="none" stroke="#fff" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
        <circle cx="3.4" cy="3.4" r="2.2"/>
        <path d="M3.4 5.6v4.8"/>
        <circle cx="3.4" cy="12.6" r="2.2"/>
        <circle cx="12.6" cy="12.6" r="2.2"/>
        <path d="M12.6 10.4V3.4H9.9"/>
        <path d="M11 2.5 9.9 3.4 11 4.3"/>
    </g>
    <!-- Badge: a check, for the review itself. -->
    <circle cx="25.2" cy="25.2" r="5.6" fill="#0969da"/>
    <circle cx="25.2" cy="25.2" r="4.4" fill="#fff"/>
    <path d="m23.3 25.2 1.4 1.5 3-3.2" fill="none" stroke="#0969da" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
</svg>
